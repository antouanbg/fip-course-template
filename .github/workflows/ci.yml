# Пуска тестовете ви при всеки push. До Упр. 3 няма тестове и стъпката минава с бележка.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node tests
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test

      - name: No project yet
        if: hashFiles('package.json') == ''
        run: echo "No package.json in the repository root yet. Nothing to test."
